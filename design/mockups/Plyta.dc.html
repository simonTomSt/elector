<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Płyta montażowa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; color: {{s.label}}">
<svg viewBox="0 0 1000 640" width="100%" style="display: block; border-radius: 6px" role="img" aria-label="{{aria}}">
  <defs>
    <pattern id="pl-grid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="0.9" fill="{{s.grid}}"></circle></pattern>
    <pattern id="pl-rail" width="30" height="70" patternUnits="userSpaceOnUse"><rect x="6" y="29" width="18" height="12" rx="3" fill="{{s.railDark}}"></rect></pattern>
    <pattern id="pl-fh" width="10" height="6" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="6" height="6" fill="{{s.finger}}"></rect></pattern>
    <pattern id="pl-fv" width="6" height="10" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="6" height="6" fill="{{s.finger}}"></rect></pattern>
    <pattern id="pl-trip" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect x="0" y="0" width="4" height="8" fill="#A98BFA"></rect><rect x="4" y="0" width="4" height="8" fill="#7A5CD6"></rect></pattern>
    <filter id="pl-glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"></feGaussianBlur></filter>
  </defs>

  <!-- płyta -->
  <rect x="0" y="0" width="1000" height="640" fill="{{s.plate}}"></rect>
  <rect x="0" y="0" width="1000" height="640" fill="url(#pl-grid)"></rect>

  <!-- korytka -->
  <g>
    <rect x="18" y="20" width="964" height="42" fill="{{s.duct}}" stroke="{{s.ductEdge}}"></rect>
    <rect x="18" y="350" width="964" height="42" fill="{{s.duct}}" stroke="{{s.ductEdge}}"></rect>
    <rect x="18" y="568" width="964" height="44" fill="{{s.duct}}" stroke="{{s.ductEdge}}"></rect>
    <rect x="18" y="20" width="54" height="592" fill="{{s.duct}}" stroke="{{s.ductEdge}}"></rect>
    <rect x="938" y="20" width="44" height="592" fill="{{s.duct}}" stroke="{{s.ductEdge}}"></rect>
    <rect x="72" y="20" width="866" height="6" fill="url(#pl-fh)"></rect>
    <rect x="72" y="56" width="866" height="6" fill="url(#pl-fh)"></rect>
    <rect x="72" y="350" width="866" height="6" fill="url(#pl-fh)"></rect>
    <rect x="72" y="386" width="866" height="6" fill="url(#pl-fh)"></rect>
    <rect x="72" y="568" width="866" height="6" fill="url(#pl-fh)"></rect>
    <rect x="72" y="606" width="866" height="6" fill="url(#pl-fh)"></rect>
    <rect x="18" y="62" width="6" height="288" fill="url(#pl-fv)"></rect>
    <rect x="66" y="62" width="6" height="288" fill="url(#pl-fv)"></rect>
    <rect x="18" y="392" width="6" height="176" fill="url(#pl-fv)"></rect>
    <rect x="66" y="392" width="6" height="176" fill="url(#pl-fv)"></rect>
    <rect x="938" y="62" width="6" height="288" fill="url(#pl-fv)"></rect>
    <rect x="976" y="62" width="6" height="288" fill="url(#pl-fv)"></rect>
    <rect x="938" y="392" width="6" height="176" fill="url(#pl-fv)"></rect>
    <rect x="976" y="392" width="6" height="176" fill="url(#pl-fv)"></rect>
  </g>

  <!-- szyny TH35 -->
  <rect x="76" y="120" width="858" height="70" fill="{{s.rail}}"></rect>
  <rect x="76" y="120" width="858" height="70" fill="url(#pl-rail)"></rect>
  <rect x="76" y="445" width="858" height="70" fill="{{s.rail}}"></rect>
  <rect x="76" y="445" width="858" height="70" fill="url(#pl-rail)"></rect>
  <text x="922" y="114" text-anchor="end" font-size="9" fill="{{s.label}}">TH35 · szyna 1</text>
  <text x="922" y="439" text-anchor="end" font-size="9" fill="{{s.label}}">TH35 · szyna 2</text>

  <!-- ===== APARATY: SZYNA 1 ===== -->
  <!-- -Q1 -->
  <g>
    <rect x="90" y="78" width="108" height="172" rx="4" fill="{{s.dev}}" stroke="{{s.devEdge}}"></rect>
    <rect x="94" y="82" width="100" height="26" rx="2" fill="{{s.devShade}}"></rect>
    <rect x="94" y="220" width="100" height="26" rx="2" fill="{{s.devShade}}"></rect>
    <text x="100" y="128" font-size="12" font-weight="600" fill="{{s.ink}}">-Q1</text>
    <text x="100" y="140" font-size="8" fill="{{s.ink2}}">C16 · 3P · 6 kA</text>
    <rect x="118" y="150" width="52" height="50" rx="3" fill="{{s.slot}}"></rect>
    <rect x="116" y="{{q1.y}}" width="56" height="20" rx="3" fill="{{q1.fill}}"></rect>
    <rect x="116" y="{{q1.y}}" width="56" height="3" rx="1.5" fill="{{q1.strip}}"></rect>
    <text x="144" y="{{q1.ty}}" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">{{q1.txt}}</text>
    <sc-if value="{{q1.tripped}}" hint-placeholder-val="{{false}}">
      <rect x="112" y="203" width="64" height="13" rx="2" fill="url(#pl-trip)"></rect>
      <text x="144" y="213" text-anchor="middle" font-size="7.5" font-weight="600" fill="#140A2E">WYZWOLONY</text>
    </sc-if>
  </g>
  <!-- -F1 -->
  <g>
    <rect x="210" y="78" width="36" height="172" rx="4" fill="{{s.dev}}" stroke="{{s.devEdge}}"></rect>
    <rect x="213" y="82" width="30" height="26" rx="2" fill="{{s.devShade}}"></rect>
    <rect x="213" y="220" width="30" height="26" rx="2" fill="{{s.devShade}}"></rect>
    <text x="228" y="128" text-anchor="middle" font-size="10" font-weight="600" fill="{{s.ink}}">-F1</text>
    <text x="228" y="140" text-anchor="middle" font-size="7" fill="{{s.ink2}}">B6</text>
    <rect x="218" y="150" width="20" height="50" rx="3" fill="{{s.slot}}"></rect>
    <rect x="216" y="152" width="24" height="20" rx="3" fill="#2F363E"></rect>
    <rect x="216" y="152" width="24" height="3" rx="1.5" fill="{{f1strip}}"></rect>
    <text x="228" y="166" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">I</text>
  </g>
  <!-- -T1 -->
  <g>
    <rect x="258" y="78" width="72" height="172" rx="4" fill="{{s.dev}}" stroke="{{s.devEdge}}"></rect>
    <rect x="262" y="220" width="64" height="26" rx="2" fill="{{s.devShade}}"></rect>
    <text x="266" y="104" font-size="12" font-weight="600" fill="{{s.ink}}">-T1</text>
    <text x="266" y="117" font-size="8" fill="{{s.ink2}}">24 V DC · 2,5 A</text>
    <rect x="266" y="130" width="56" height="44" rx="2" fill="none" stroke="{{s.devEdge}}" stroke-dasharray="2 2"></rect>
    <text x="294" y="157" text-anchor="middle" font-size="9" fill="{{s.ink2}}">~ / =</text>
    <circle cx="276" cy="196" r="6" fill="{{s.devShade}}" stroke="{{s.devEdge}}"></circle>
    <path d="M276 191 L276 196" stroke="{{s.ink2}}" stroke-width="1.4"></path>
    <text x="276" y="212" text-anchor="middle" font-size="6.5" fill="{{s.ink2}}">ADJ</text>
    <circle cx="312" cy="194" r="4.5" fill="{{t1led}}"></circle>
    <text x="312" y="212" text-anchor="middle" font-size="6.5" fill="{{s.ink2}}">DC OK</text>
  </g>
  <!-- -K1 -->
  <g>
    <rect x="362" y="78" width="90" height="172" rx="4" fill="{{s.dev}}" stroke="{{s.devEdge}}"></rect>
    <rect x="366" y="82" width="82" height="26" rx="2" fill="{{s.devShade}}"></rect>
    <rect x="366" y="220" width="82" height="26" rx="2" fill="{{s.devShade}}"></rect>
    <text x="370" y="128" font-size="12" font-weight="600" fill="{{s.ink}}">-K1</text>
    <text x="370" y="140" font-size="7.5" fill="{{s.ink2}}">AC-3 9 A · =24 V</text>
    <rect x="390" y="150" width="34" height="34" rx="3" fill="{{k1.win}}" stroke="{{s.devEdge}}"></rect>
    <text x="407" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="{{k1.ink}}">{{k1.txt}}</text>
    <text x="407" y="202" text-anchor="middle" font-size="7" fill="{{s.ink2}}">1NO + 1NC</text>
  </g>

  <!-- ===== SZYNA 2 ===== -->
  <!-- złączki -->
  <text x="90" y="404" font-size="9" font-weight="600" fill="{{s.label}}">-X1</text>
  <text x="186" y="404" font-size="9" font-weight="600" fill="{{s.label}}">-X2</text>
  <text x="470" y="404" font-size="9" font-weight="600" fill="{{s.label}}">-X3</text>
  <sc-for list="{{blocks}}" as="b" hint-placeholder-count="17">
    <rect x="{{b.x}}" y="410" width="15" height="138" rx="1.5" fill="{{b.fill}}" stroke="{{s.devEdge}}" stroke-width="0.8"></rect>
    <sc-if value="{{b.pe}}" hint-placeholder-val="{{false}}"><rect x="{{b.sx}}" y="410" width="5" height="138" fill="#F2D02B"></rect></sc-if>
    <text x="{{b.cx}}" y="483" text-anchor="middle" font-size="7" font-weight="600" fill="{{b.ink}}">{{b.lab}}</text>
  </sc-for>
  <text x="130" y="560" text-anchor="middle" font-size="8" fill="{{s.label}}">↓ zasilanie 3/N/PE 400 V</text>
  <text x="218" y="560" text-anchor="middle" font-size="8" fill="{{s.label}}">↓ -M1</text>
  <text x="534" y="560" text-anchor="middle" font-size="8" fill="{{s.label}}">↓ drzwi: -S1 -S2 -H1</text>
  <!-- -F2 -->
  <g>
    <rect x="362" y="410" width="90" height="138" rx="4" fill="{{s.dev}}" stroke="{{s.devEdge}}"></rect>
    <rect x="366" y="414" width="82" height="24" rx="2" fill="{{s.devShade}}"></rect>
    <rect x="366" y="520" width="82" height="24" rx="2" fill="{{s.devShade}}"></rect>
    <text x="370" y="455" font-size="11" font-weight="600" fill="{{s.ink}}">-F2</text>
    <circle cx="384" cy="485" r="13" fill="{{s.devShade}}" stroke="{{s.devEdge}}"></circle>
    <path d="M384 485 L392 476" stroke="{{s.ink}}" stroke-width="2" stroke-linecap="round"></path>
    <text x="402" y="482" font-size="8" font-weight="600" fill="{{s.ink}}">{{f2set}}</text>
    <text x="402" y="492" font-size="6.5" fill="{{s.ink2}}">6–10 A</text>
    <circle cx="436" cy="461" r="6" fill="#2D6FE0"></circle>
    <text x="436" y="464" text-anchor="middle" font-size="6.5" font-weight="600" fill="#FFFFFF">R</text>
    <rect x="402" y="498" width="44" height="14" rx="2" fill="{{s.slot}}"></rect>
    <text x="424" y="508" text-anchor="middle" font-size="7.5" font-weight="600" fill="{{f2ok}}">OK</text>
  </g>
  <!-- szyna PE -->
  <g>
    <text x="630" y="456" font-size="9" font-weight="600" fill="{{s.label}}">-PE</text>
    <rect x="630" y="462" width="160" height="32" rx="3" fill="#2E9E4F"></rect>
    <rect x="630" y="474" width="160" height="8" fill="#F2D02B"></rect>
    <rect x="636" y="466" width="148" height="24" rx="2" fill="#C9A34A" opacity="0.92"></rect>
    <sc-for list="{{peScrews}}" as="p" hint-placeholder-count="8">
      <circle cx="{{p.x}}" cy="478" r="5" fill="#E6C978" stroke="#7D6427"></circle>
      <path d="{{p.slot}}" stroke="#7D6427" stroke-width="1.2"></path>
    </sc-for>
  </g>

  <!-- ===== PRZEWODY ===== -->
  <sc-for list="{{wires}}" as="w" hint-placeholder-count="24">
    <g opacity="{{w.op}}">
      <sc-if value="{{w.glow}}" hint-placeholder-val="{{false}}">
        <path d="{{w.d}}" fill="none" stroke="{{w.glowC}}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" filter="url(#pl-glow)"></path>
      </sc-if>
      <sc-if value="{{w.solid}}" hint-placeholder-val="{{true}}">
        <path d="{{w.d}}" fill="none" stroke="{{s.halo}}" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="{{w.d}}" fill="none" stroke="{{w.core}}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path>
      </sc-if>
      <sc-if value="{{w.pe}}" hint-placeholder-val="{{false}}">
        <path d="{{w.d}}" fill="none" stroke="#F2D02B" stroke-width="3.4" stroke-dasharray="7 7" stroke-linejoin="round"></path>
      </sc-if>
      <sc-if value="{{w.flow}}" hint-placeholder-val="{{false}}">
        <path d="{{w.d}}" fill="none" stroke="#9BE7FF" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 12">
          <animate attributeName="stroke-dashoffset" from="28" to="0" dur="0.9s" repeatCount="indefinite"></animate>
        </path>
      </sc-if>
      <sc-if value="{{w.pulse}}" hint-placeholder-val="{{false}}">
        <path d="{{w.d}}" fill="none" stroke="#F0564F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#pl-glow)">
          <animate attributeName="opacity" values="0.9;0.15;0.9" dur="0.9s" repeatCount="indefinite"></animate>
        </path>
        <path d="{{w.d}}" fill="none" stroke="#FF6B63" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
          <animate attributeName="opacity" values="1;0.45;1" dur="0.9s" repeatCount="indefinite"></animate>
        </path>
      </sc-if>
      <sc-if value="{{w.missing}}" hint-placeholder-val="{{false}}">
        <path d="{{w.d}}" fill="none" stroke="#F0564F" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round"></path>
      </sc-if>
    </g>
  </sc-for>

  <!-- zaciski -->
  <sc-for list="{{terms}}" as="z" hint-placeholder-count="40">
    <sc-if value="{{z.hl}}" hint-placeholder-val="{{false}}"><circle cx="{{z.x}}" cy="{{z.y}}" r="9.5" fill="none" stroke="{{z.hlC}}" stroke-width="2"></circle></sc-if>
    <circle cx="{{z.x}}" cy="{{z.y}}" r="5.2" fill="{{s.term}}" stroke="{{s.termEdge}}" stroke-width="1"></circle>
    <path d="{{z.slot}}" stroke="{{s.termEdge}}" stroke-width="1.2"></path>
    <sc-if value="{{z.showLab}}" hint-placeholder-val="{{true}}"><text x="{{z.x}}" y="{{z.ly}}" text-anchor="middle" font-size="7" fill="{{s.ink2}}">{{z.lab}}</text></sc-if>
  </sc-for>

  <!-- tryb edycji: walidacja + przeciąganie aparatu -->
  <sc-if value="{{isEdit}}" hint-placeholder-val="{{true}}">
    <g>
      <circle cx="744" cy="377" r="10" fill="#F0564F"></circle>
      <text x="744" y="381" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">1</text>
      <circle cx="216" cy="359" r="10" fill="#F0564F"></circle>
      <text x="216" y="363" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">2</text>
      <circle cx="384" cy="440" r="9" fill="#F5B53F"></circle>
      <text x="384" y="444" text-anchor="middle" font-size="10" font-weight="600" fill="#1A1204">3</text>
    </g>
  </sc-if>
  <sc-if value="{{showGhost}}" hint-placeholder-val="{{false}}">
    <g>
      <path d="M474 66 V262 M510 66 V262" stroke="{{s.accent}}" stroke-width="1" stroke-dasharray="3 3"></path>
      <rect x="474" y="78" width="36" height="172" rx="4" fill="{{s.accentSoft}}" stroke="{{s.accent}}" stroke-width="1.6" stroke-dasharray="5 4"></rect>
      <text x="492" y="130" text-anchor="middle" font-size="10" font-weight="600" fill="{{s.accent}}">-K2</text>
      <text x="492" y="143" text-anchor="middle" font-size="7" fill="{{s.accent}}">0,1–10 s</text>
      <rect x="520" y="140" width="176" height="44" rx="6" fill="{{s.tipBg}}" stroke="{{s.accent}}"></rect>
      <text x="530" y="158" font-size="9.5" font-weight="600" fill="{{s.tipInk}}">Przekaźnik czasowy -K2</text>
      <text x="530" y="173" font-size="8.5" fill="{{s.tipInk2}}">1 mod. · przyciągnięty do szyny 1</text>
      <path d="M500 198 l0 18 l5 -5 l4 9 l3 -1.5 l-4 -9 l7 0 z" fill="#FFFFFF" stroke="#0B0F13" stroke-width="1.2" stroke-linejoin="round"></path>
    </g>
  </sc-if>

  <!-- zaznaczenie aparatu -->
  <sc-if value="{{selK1}}" hint-placeholder-val="{{false}}">
    <g>
      <rect x="355" y="71" width="104" height="186" rx="6" fill="none" stroke="{{s.accent}}" stroke-width="2"></rect>
      <rect x="351" y="67" width="8" height="8" fill="{{s.accent}}"></rect><rect x="455" y="67" width="8" height="8" fill="{{s.accent}}"></rect>
      <rect x="351" y="253" width="8" height="8" fill="{{s.accent}}"></rect><rect x="455" y="253" width="8" height="8" fill="{{s.accent}}"></rect>
    </g>
  </sc-if>
  <sc-if value="{{selF2}}" hint-placeholder-val="{{false}}">
    <g>
      <rect x="355" y="403" width="104" height="152" rx="6" fill="none" stroke="{{s.accent}}" stroke-width="2"></rect>
      <rect x="351" y="399" width="8" height="8" fill="{{s.accent}}"></rect><rect x="455" y="399" width="8" height="8" fill="{{s.accent}}"></rect>
      <rect x="351" y="551" width="8" height="8" fill="{{s.accent}}"></rect><rect x="455" y="551" width="8" height="8" fill="{{s.accent}}"></rect>
    </g>
  </sc-if>

  <!-- zwarcie: znacznik miejsca -->
  <sc-if value="{{isShort}}" hint-placeholder-val="{{false}}">
    <g>
      <circle cx="372" cy="94" r="16" fill="none" stroke="#F0564F" stroke-width="2.5">
        <animate attributeName="r" values="10;22;10" dur="0.9s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="1;0.1;1" dur="0.9s" repeatCount="indefinite"></animate>
      </circle>
      <rect x="250" y="68" width="104" height="22" rx="4" fill="#F0564F"></rect>
      <path d="M262 72 l-5 8 h5 l-3 7 l8 -10 h-5 l3 -5 z" fill="#FFFFFF"></path>
      <text x="272" y="83" font-size="10" font-weight="600" fill="#FFFFFF">Zwarcie L1–N</text>
    </g>
  </sc-if>

  <!-- miernik: sondy i cęgi -->
  <sc-if value="{{showProbes}}" hint-placeholder-val="{{false}}">
    <g>
      <path d="M182 552 C 300 640, 700 600, 1000 610" fill="none" stroke="#B3261E" stroke-width="4" stroke-linecap="round"></path>
      <path d="M232 552 C 360 630, 720 640, 1000 632" fill="none" stroke="#111418" stroke-width="4" stroke-linecap="round"></path>
      <path d="M98 425 L114 452" stroke="#D9DEE3" stroke-width="3" stroke-linecap="round"></path>
      <path d="M114 452 L182 552" stroke="#D92D20" stroke-width="15" stroke-linecap="round"></path>
      <path d="M120 461 L128 473" stroke="#FFB4AB" stroke-width="3" stroke-linecap="round"></path>
      <path d="M146 425 L162 452" stroke="#D9DEE3" stroke-width="3" stroke-linecap="round"></path>
      <path d="M162 452 L232 552" stroke="#1B1F24" stroke-width="15" stroke-linecap="round"></path>
      <path d="M162 452 L232 552" stroke="#5C6670" stroke-width="15" stroke-linecap="round" fill="none" opacity="0.25"></path>
      <circle cx="98" cy="425" r="9" fill="none" stroke="#F0564F" stroke-width="2"></circle>
      <circle cx="146" cy="425" r="9" fill="none" stroke="#E7ECF1" stroke-width="2"></circle>
      <ellipse cx="388" cy="300" rx="18" ry="11" fill="none" stroke="#F5B53F" stroke-width="6"></ellipse>
      <path d="M406 300 L470 300" stroke="#F5B53F" stroke-width="12" stroke-linecap="round"></path>
      <rect x="478" y="286" width="78" height="28" rx="5" fill="#141A20" stroke="#F5B53F"></rect>
      <text x="517" y="305" text-anchor="middle" font-size="12" font-weight="600" fill="#F5B53F">7,8 A~</text>
    </g>
  </sc-if>

  <text x="20" y="632" font-size="9" fill="{{s.label}}">Płyta montażowa 500 × 320 mm · siatka 9 mm · {{modeLabel}}</text>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["edit","on","short","meter","off"],"default":"edit"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"ghost":{"editor":"boolean","default":false},"select":{"editor":"enum","options":["none","K1","F2"],"default":"none"},"$preview":{"width":1000,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'edit';
    const theme = this.props.theme ?? 'dark';
    const ghost = this.props.ghost ?? false;
    const select = this.props.select ?? 'none';
    const SC = {
      dark: {plate:'#1F262D',grid:'#323C46',duct:'#2A323B',ductEdge:'#4A5561',finger:'#3A444F',rail:'#8A939C',railDark:'#5F6872',dev:'#D3D8DD',devShade:'#BCC3CA',devEdge:'#7E8892',ink:'#11161B',ink2:'#3B4651',halo:'rgba(255,255,255,0.34)',label:'#A3B0BC',term:'#D7DCE1',termEdge:'#4E5964',slot:'#2A3036',blk:'#A9B1B9',accent:'#4EA8FF',accentSoft:'rgba(78,168,255,0.16)',tipBg:'#141A20',tipInk:'#E7ECF1',tipInk2:'#9BA8B5'},
      light: {plate:'#C4CCD3',grid:'#AEB7C0',duct:'#EEF1F3',ductEdge:'#97A2AC',finger:'#D8DEE3',rail:'#A0A9B2',railDark:'#78828C',dev:'#FBFCFD',devShade:'#E3E7EB',devEdge:'#7F8992',ink:'#11161B',ink2:'#46525E',halo:'rgba(255,255,255,0.75)',label:'#36414C',term:'#E2E6EA',termEdge:'#56616C',slot:'#2A3036',blk:'#B7BEC5',accent:'#1D6FD8',accentSoft:'rgba(29,111,216,0.14)',tipBg:'#FFFFFF',tipInk:'#121820',tipInk2:'#53606C'}
    };
    const s = SC[theme] || SC.dark;
    const live = mode === 'on' || mode === 'meter';
    const short = mode === 'short';
    const edit = mode === 'edit';
    const C = { br:'#8A5A2E', bk:'#1D1D1D', gr:'#8F969D', bu:'#2D6FE0', pe:'#2E9E4F', db:'#2440A8' };
    const AMBER = '#F5B53F';

    const rp = (pts) => {
      const r = 7;
      let d = 'M' + pts[0][0] + ' ' + pts[0][1];
      for (let i = 1; i < pts.length - 1; i++) {
        const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
        const d1 = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]) || 1;
        const d2 = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) || 1;
        const rr = Math.min(r, d1 / 2, d2 / 2);
        const ax = p1[0] + (p0[0] - p1[0]) / d1 * rr, ay = p1[1] + (p0[1] - p1[1]) / d1 * rr;
        const bx = p1[0] + (p2[0] - p1[0]) / d2 * rr, by = p1[1] + (p2[1] - p1[1]) / d2 * rr;
        d += ' L' + ax.toFixed(1) + ' ' + ay.toFixed(1) + ' Q' + p1[0] + ' ' + p1[1] + ' ' + bx.toFixed(1) + ' ' + by.toFixed(1);
      }
      const l = pts[pts.length - 1];
      return d + ' L' + l[0] + ' ' + l[1];
    };

    // id, kolor, potencjał, prąd płynie, trasa
    const W = [
      ['W1','br','up',true,[[98,425],[98,359],[28,359],[28,28],[106,28],[106,94]]],
      ['W2','bk','up',true,[[114,425],[114,362],[32,362],[32,32],[144,32],[144,94]]],
      ['W3','gr','up',true,[[130,425],[130,365],[36,365],[36,36],[180,36],[180,94]]],
      ['J1','br','up',true,[[110,94],[110,70],[228,70],[228,94]]],
      ['W4','br','down',true,[[108,234],[108,368],[40,368],[40,40],[372,40],[372,94]]],
      ['W5','bk','down',true,[[144,234],[144,371],[44,371],[44,44],[388,44],[388,94]]],
      ['W6','gr','down',true,[[180,234],[180,374],[48,374],[48,48],[404,48],[404,94]]],
      ['W7','br','down',true,[[372,234],[372,425]]],
      ['W8','bk','down',true,[[388,234],[388,425]]],
      ['W9','gr','down',true,[[404,234],[404,425]]],
      ['W10','br','down',true,[[372,532],[372,578],[52,578],[52,377],[194,377],[194,425]]],
      ['W11','bk','down',true,[[388,532],[388,582],[56,582],[56,380],[210,380],[210,425]]],
      ['W12','gr','down',true,[[404,532],[404,586],[60,586],[60,383],[226,383],[226,425]]],
      ['W13','bu','n',true,[[146,425],[146,359],[286,359],[286,234]]],
      ['W14','br','up',true,[[228,234],[228,362],[270,362],[270,234]]],
      ['PE1','pe','pe',false,[[162,532],[162,594],[650,594],[650,494]]],
      ['PE2','pe','pe',false,[[242,532],[242,598],[670,598],[670,494]]],
      ['C1','db','dc',true,[[304,234],[304,365],[478,365],[478,425]]],
      ['C2','db','dc',false,[[494,425],[494,416],[510,416],[510,425]]],
      ['C3','db','dc',true,[[424,94],[424,52],[950,52],[950,374],[498,374],[498,425]]],
      ['C4','db','dc',true,[[530,425],[530,377],[956,377],[956,55],[440,55],[440,94]]],
      ['C5','db','dc',true,[[424,234],[424,368],[522,368],[522,425]]],
      ['C6','db','dc0',true,[[440,234],[440,400],[424,400],[424,425]]],
      ['C7','db','dc0',true,[[424,532],[424,602],[962,602],[962,380],[320,380],[320,234]]]
    ];
    const wires = W.map(([id, col, pot, fl, pts]) => {
      const missing = edit && id === 'C4';
      let glow = false;
      if (live) glow = pot === 'up' || pot === 'down' || pot === 'dc';
      if (short) glow = pot === 'up' || (pot === 'dc' && (id === 'C1' || id === 'C2' || id === 'C3'));
      const pulse = short && id === 'W4';
      let core = C[col];
      if (edit && id === 'W13') core = C.bk;
      return {
        d: rp(pts), core, glow, glowC: AMBER, solid: !missing && !pulse, missing, pulse,
        pe: col === 'pe' && !missing, flow: live && fl,
        op: short && (pot === 'down' || pot === 'dc0' || id === 'C4' || id === 'C5') && !pulse ? '0.6' : '1'
      };
    });

    const terms = [];
    const T = (x, y, lab, pos, hl) => terms.push({
      x, y, lab, ly: pos === 'top' ? y + 15 : y - 9, showLab: !!lab,
      slot: 'M' + (x - 3) + ' ' + (y + 3) + ' L' + (x + 3) + ' ' + (y - 3),
      hl: !!hl, hlC: hl === 'err' ? '#F0564F' : '#4EA8FF'
    });
    [[108,'1'],[144,'3'],[180,'5']].forEach(([x,l]) => T(x, 94, l, 'top'));
    [[108,'2'],[144,'4'],[180,'6']].forEach(([x,l]) => T(x, 234, l, 'bot'));
    T(228, 94, '1', 'top'); T(228, 234, '2', 'bot');
    [[270,'L'],[286,'N'],[304,'+'],[320,'−']].forEach(([x,l]) => T(x, 234, l, 'bot'));
    [[372,'1'],[388,'3'],[404,'5'],[424,'13']].forEach(([x,l]) => T(x, 94, l, 'top'));
    T(440, 94, 'A1', 'top', edit ? 'err' : null);
    [[372,'2'],[388,'4'],[404,'6'],[424,'14'],[440,'A2']].forEach(([x,l]) => T(x, 234, l, 'bot'));
    [[372,'1'],[388,'3'],[404,'5'],[424,'95']].forEach(([x,l]) => T(x, 425, l, 'top'));
    [[372,'2'],[388,'4'],[404,'6'],[424,'96']].forEach(([x,l]) => T(x, 532, l, 'bot'));

    const blocks = [];
    const B = (x, lab, kind, hl) => {
      blocks.push({ x: x - 7.5, sx: x - 2.5, cx: x, lab,
        pe: kind === 'pe', fill: kind === 'pe' ? '#2E9E4F' : (kind === 'n' ? '#3C78D8' : s.blk),
        ink: kind === 'n' || kind === 'pe' ? '#FFFFFF' : s.ink });
      terms.push({ x, y: 425, lab: '', ly: 0, showLab: false, slot: 'M' + (x - 3) + ' 428 L' + (x + 3) + ' 422', hl: !!hl, hlC: '#F0564F' });
      terms.push({ x, y: 532, lab: '', ly: 0, showLab: false, slot: 'M' + (x - 3) + ' 535 L' + (x + 3) + ' 529', hl: false, hlC: '#F0564F' });
    };
    B(98,'L1'); B(114,'L2'); B(130,'L3'); B(146,'N','n'); B(162,'PE','pe');
    B(194,'U1'); B(210,'V1'); B(226,'W1'); B(242,'PE','pe');
    ['1','2','3','4','5','6','7','8'].forEach((l, i) => B(478 + i * 16, l, null, edit && l === '4'));

    const peScrews = [];
    for (let i = 0; i < 8; i++) { const x = 648 + i * 18; peScrews.push({ x, slot: 'M' + (x - 3) + ' 481 L' + (x + 3) + ' 475' }); }

    const q1on = live;
    const q1 = short
      ? { y: 178, ty: 192, fill: '#7A5CD6', strip: '#A98BFA', txt: '0', tripped: true }
      : (q1on ? { y: 152, ty: 166, fill: '#2F363E', strip: AMBER, txt: 'I', tripped: false }
              : { y: 178, ty: 192, fill: '#2F363E', strip: '#6B7682', txt: '0', tripped: false });
    const k1 = live ? { win: '#3CC7F0', ink: '#06222C', txt: 'I' } : { win: '#3A4149', ink: '#C9D0D6', txt: '0' };
    const modeLabel = { edit: 'tryb edycji', on: 'symulacja – pod napięciem', short: 'symulacja – zwarcie', meter: 'pomiar', off: 'odłączone – LOTO' }[mode] || '';
    return {
      s, wires, terms, blocks, peScrews, q1, k1,
      f1strip: (live || short) ? AMBER : '#6B7682',
      t1led: (live || short) ? '#3FCF8E' : '#56616C',
      f2set: edit ? '10 A' : '8,5 A', f2ok: '#3FCF8E',
      isEdit: edit, showGhost: edit && ghost, isShort: short, showProbes: mode === 'meter',
      selK1: select === 'K1', selF2: select === 'F2', modeLabel,
      aria: 'Płyta montażowa: -Q1, -F1, -T1, -K1 na szynie 1; złączki -X1, -X2, -X3, -F2 i szyna PE na szynie 2; ' + modeLabel
    };
  }
}
</script>
